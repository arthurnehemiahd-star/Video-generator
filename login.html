<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sign in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-page">
    <form id="login-form" class="login-box">
        <h1>🔒 Private Access</h1>
        <p class="error" id="error-msg" style="display:none"></p>
        <input type="password" id="password" placeholder="Password" autofocus required>
        <button type="submit">Enter</button>
    </form>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        (async () => {
            // If no password is configured server-side, skip straight through.
            const { auth_required } = await api.session();
            if (!auth_required) {
                window.location.href = "index.html";
            }
        })();

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById("error-msg");
            errorEl.style.display = "none";
            try {
                const result = await api.login(
    document.getElementById("password").value
);

alert("LOGIN REQUEST WORKED!");

window.location.href = "index.html";
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
