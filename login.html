<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Video Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="center-page">

    <div class="login-box">
        <h1>🎬 Video Generator</h1>
        <p>Connecting to your software...</p>
    </div>

    <script>
        const API_BASE_URL =
            "https://video-generator-seqn.onrender.com";

        fetch(`${API_BASE_URL}/api/session`)
            .then(response => response.json())
            .then(data => {

                if (data.auth_required === false) {
                    window.location.href = "index.html";
                } else {
                    window.location.href = "login.html";
                }

            })
            .catch(error => {

                document.querySelector(".login-box").innerHTML = `
                    <h1>Connection Error</h1>
                    <p>Could not connect to the backend.</p>
                `;

                console.error(error);
            });
    </script>

</body>
</html>
