<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Video Generator</title>

<link rel="stylesheet" href="style.css">

<!-- Backend configuration MUST load first -->
<script src="config.js"></script>

<!-- API functions -->
<script src="api.js"></script>
```

</head>

<body>

```
<header>
    <h1>🎬 Video Generator</h1>
    <p>Create videos from your ideas.</p>
</header>

<main>

    <section class="generator">

        <h2>Create a Video</h2>

        <label for="description">
            Describe your video
        </label>

        <textarea
            id="description"
            placeholder="Example: A cinematic adventure through a futuristic city..."
            rows="6"
        ></textarea>

        <label for="duration">
            Duration (seconds)
        </label>

        <input
            id="duration"
            type="number"
            min="5"
            max="120"
            value="30"
        >

        <button id="generateBtn">
            🎬 Generate Video
        </button>

        <div id="status"></div>

        <div id="result" style="display:none;">

            <h3>✅ Video Created!</h3>

            <p id="projectName"></p>

            <a
                id="downloadBtn"
                href="#"
                target="_blank"
                rel="noopener"
            >
                ⬇️ Download Video
            </a>

        </div>

    </section>

</main>

<script>

    // =====================================================
    // Make sure API loaded
    // =====================================================

    if (!window.api) {

        console.error("api.js did not load.");

        document.getElementById("status").textContent =
            "❌ API failed to load. Check api.js.";

    }


    // =====================================================
    // Generate Video
    // =====================================================

    const generateBtn =
        document.getElementById("generateBtn");

    generateBtn.addEventListener(
        "click",
        async function () {

            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();

            const duration =
                Number(
                    document
                        .getElementById("duration")
                        .value
                );

            const status =
                document.getElementById("status");

            const result =
                document.getElementById("result");

            const projectName =
                document.getElementById("projectName");

            const downloadBtn =
                document.getElementById("downloadBtn");


            // ---------------------------------------------
            // Validation
            // ---------------------------------------------

            if (!description) {

                status.textContent =
                    "❌ Please describe the video.";

                return;
            }

            if (
                !duration ||
                duration < 5 ||
                duration > 120
            ) {

                status.textContent =
                    "❌ Duration must be between 5 and 120 seconds.";

                return;
            }


            // ---------------------------------------------
            // Loading
            // ---------------------------------------------

            generateBtn.disabled = true;

            generateBtn.textContent =
                "⏳ Generating...";

            status.textContent =
                "🎬 Creating your video...";

            result.style.display =
                "none";


            try {

                // -----------------------------------------
                // Send request to backend
                // -----------------------------------------

                const data =
                    await window.api.generateVideo(
                        description,
                        duration
                    );


                // -----------------------------------------
                // Success
                // -----------------------------------------

                status.textContent =
                    "✅ Video generated successfully!";

                projectName.textContent =
                    "Project: " +
                    (
                        data.project ||
                        "Generated Video"
                    );


                if (
                    data.project &&
                    data.filename
                ) {

                    downloadBtn.href =
                        window.api.downloadUrl(
                            data.project,
                            data.filename
                        );

                    result.style.display =
                        "block";

                } else if (data.download_url) {

                    downloadBtn.href =
                        data.download_url;

                    result.style.display =
                        "block";
                }


            } catch (error) {

                console.error(error);

                status.textContent =
                    "❌ " +
                    (
                        error.message ||
                        "Something went wrong."
                    );

            }


            // ---------------------------------------------
            // Reset button
            // ---------------------------------------------

            generateBtn.disabled = false;

            generateBtn.textContent =
                "🎬 Generate Video";

        }
    );

</script>
```

</body>
</html>
