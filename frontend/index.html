<!DOCTYPE html>

<html lang="en">
<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Generator</title>

<link rel="stylesheet" href="style.css">

<script src="config.js"></script>
<script src="api.js"></script>
```

</head>

<body>

```
<header>
    <h1>🎬 Video Generator</h1>
    <p>Create videos from your ideas.</p>
</header>

<main>

    <section class="generator">

        <h2>Create a Video</h2>

        <label for="description">
            Describe your video
        </label>

        <textarea
            id="description"
            rows="6"
            placeholder="Example: A cinematic adventure through a futuristic city..."
        ></textarea>

        <label for="duration">
            Duration (seconds)
        </label>

        <input
            id="duration"
            type="number"
            min="5"
            max="120"
            value="30"
        >

        <button id="generateBtn">
            🎬 Generate Video
        </button>

        <div id="status"></div>

        <div id="result" style="display: none;">

            <h3>✅ Video Created!</h3>

            <p id="projectName"></p>

            <a
                id="downloadBtn"
                href="#"
                target="_blank"
                rel="noopener"
            >
                ⬇️ Download Video
            </a>

        </div>

    </section>

</main>

<script>

    const status = document.getElementById("status");
    const generateBtn = document.getElementById("generateBtn");
    const result = document.getElementById("result");
    const projectName = document.getElementById("projectName");
    const downloadBtn = document.getElementById("downloadBtn");

    if (!window.api) {

        status.textContent =
            "❌ API failed to load. Check api.js.";

        generateBtn.disabled = true;

    } else {

        status.textContent =
            "✅ API connected.";

    }

    generateBtn.addEventListener("click", async function () {

        const description =
            document
                .getElementById("description")
                .value
                .trim();

        const duration =
            Number(
                document
                    .getElementById("duration")
                    .value
            );

        if (!description) {

            status.textContent =
                "❌ Please describe the video.";

            return;
        }

        if (duration < 5 || duration > 120) {

            status.textContent =
                "❌ Duration must be between 5 and 120 seconds.";

            return;
        }

        generateBtn.disabled = true;

        generateBtn.textContent =
            "⏳ Generating...";

        status.textContent =
            "🎬 Creating your video...";

        result.style.display = "none";

        try {

            const data =
                await window.api.generateVideo(
                    description,
                    duration
                );

            status.textContent =
                "✅ Video generated successfully!";

            projectName.textContent =
                "Project: " +
                (data.project || "Generated Video");

            if (data.project && data.filename) {

                downloadBtn.href =
                    window.api.downloadUrl(
                        data.project,
                        data.filename
                    );

                result.style.display = "block";

            } else if (data.download_url) {

                downloadBtn.href =
                    data.download_url;

                result.style.display = "block";
            }

        } catch (error) {

            console.error(error);

            status.textContent =
                "❌ " +
                (error.message || "Something went wrong.");

        }

        generateBtn.disabled = false;

        generateBtn.textContent =
            "🎬 Generate Video";

    });

</script>
```

</body>
</html>
