<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Video Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="brand">
    <div class="logo-mark">▶</div>
    <span>Video Generator</span>
</div>
        <a href="projects.html">Projects</a>
    </nav>

    <main>
        <div id="chat-log"></div>

        <form id="chat-form">
            <input
                type="text"
                id="chat-input"
                placeholder="Message, or a /command like /help"
                autocomplete="off"
                autofocus
            >

            <button type="submit">Send</button>
        </form>

        <p class="hint">
            Try
            <code>/help</code>,
            <code>/trailer &lt;project&gt; | &lt;idea&gt;</code>,
            <code>/musicvideo &lt;project&gt; | &lt;theme&gt;</code>,
            <code>/file list</code>,
            <code>/open list</code>
        </p>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>

    <script>
        const log = document.getElementById("chat-log");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("chat-input");

        const assistantName = "Video Generator";

        function addMessage(role, name, text) {
            const div = document.createElement("div");

            div.className = "msg " + role;

            div.innerHTML =
                "<strong>" + name + ":</strong> <span></span>";

            div.querySelector("span").textContent = text;

            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const text = input.value.trim();

            if (!text) return;

            addMessage("user", "You", text);

            input.value = "";
            input.focus();

            try {
                const data = await api.sendMessage(text);

                addMessage(
                    "assistant",
                    assistantName,
                    data.reply
                );

            } catch (err) {
                addMessage(
                    "assistant",
                    assistantName,
                    "Error: " + err.message
                );
            }
        });

        // Load previous conversation
        (async () => {
            try {
                const history = await api.history();

                for (const msg of history) {
                    addMessage(
                        msg.role,
                        msg.role === "user"
                            ? "You"
                            : assistantName,
                        msg.content
                    );
                }

            } catch (err) {
                console.log("History could not be loaded:", err.message);
            }
        })();
    </script>

</body>
</html>
