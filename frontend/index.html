<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Video Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <span class="brand" id="brand">Video Generator</span>
        <a href="projects.html">Projects</a>
        <a id="logout-link">Log out</a>
    </nav>

    <main>
        <div id="chat-log"></div>

        <form id="chat-form">
            <input
                type="text"
                id="chat-input"
                placeholder="Message, or a /command like /help"
                autocomplete="off"
                autofocus
            >

            <button type="submit">Send</button>
        </form>

        <p class="hint">
            Try
            <code>/help</code>,
            <code>/trailer &lt;project&gt; | &lt;idea&gt;</code>,
            <code>/musicvideo &lt;project&gt; | &lt;theme&gt;</code>,
            <code>/file list</code>,
            <code>/open list</code>
        </p>
    </main>

    <!-- Configuration -->
    <script src="config.js"></script>

    <!-- Backend API -->
    <script src="api.js"></script>

    <script>
        const log = document.getElementById('chat-log');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');

        let assistantName = 'Video Generator';

        function addMessage(role, name, text) {
            const div = document.createElement('div');

            div.className = 'msg ' + role;

            div.innerHTML =
                '<strong>' + name + ':</strong> <span></span>';

            div.querySelector('span').textContent = text;

            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        // Log out
        document
            .getElementById('logout-link')
            .addEventListener('click', () => api.logout());


        // Send message to backend
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = input.value.trim();

            if (!text) return;

            addMessage('user', 'You', text);

            input.value = '';

            try {
                const data = await api.sendMessage(text);

                addMessage(
                    'assistant',
                    assistantName,
                    data.reply
                );

            } catch (err) {

                addMessage(
                    'assistant',
                    assistantName,
                    `Error: ${err.message}`
                );

            }
        });


        // Check login session and load history
        (async () => {

            try {

                const { auth_required } = await api.session();

                if (
                    auth_required &&
                    !localStorage.getItem('video_generator_token')
                ) {
                    window.location.href = 'login.html';
                    return;
                }

                try {

                    const history = await api.history();

                    for (const msg of history) {

                        addMessage(
                            msg.role,
                            msg.role === 'user'
                                ? 'You'
                                : assistantName,
                            msg.content
                        );

                    }

                } catch (err) {

                    // History loading failure isn't fatal.
                    // The chat can still work.

                }

            } catch (err) {

                addMessage(
                    'assistant',
                    assistantName,
                    `Connection error: ${err.message}`
                );

            }

        })();

    </script>

</body>
</html>
