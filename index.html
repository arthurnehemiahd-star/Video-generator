<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Personal AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <span class="brand" id="brand">Personal AI</span>
        <a href="projects.html">Projects</a>
        <a id="logout-link">Log out</a>
    </nav>

    <main>
        <div id="chat-log"></div>

        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Message, or a /command like /help" autocomplete="off" autofocus>
            <button type="submit">Send</button>
        </form>

        <p class="hint">Try <code>/help</code>, <code>/trailer &lt;project&gt; | &lt;idea&gt;</code>, <code>/musicvideo &lt;project&gt; | &lt;theme&gt;</code>, <code>/file list</code>, <code>/open list</code></p>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        const log = document.getElementById('chat-log');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');
        let assistantName = 'Personal AI';

        function addMessage(role, name, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = '<strong>' + name + ':</strong> <span></span>';
            div.querySelector('span').textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById('logout-link').addEventListener('click', () => api.logout());

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            addMessage('user', 'You', text);
            input.value = '';

            try {
                const data = await api.sendMessage(text);
                addMessage('assistant', assistantName, data.reply);
            } catch (err) {
                addMessage('assistant', assistantName, `Error: ${err.message}`);
            }
        });

        (async () => {
            const { auth_required } = await api.session();
            if (auth_required && !localStorage.getItem('personal_ai_token')) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const history = await api.history();
                for (const msg of history) {
                    addMessage(msg.role, msg.role === 'user' ? 'You' : assistantName, msg.content);
                }
            } catch (err) {
                // history load failure isn't fatal — chat still works
            }
        })();
    </script>
</body>
</html>
